<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./src/assets/scissors.svg" />

    <title>Hair Day</title>
  </head>
  <body>
    <a
      href="login.html"
      style="
        position: absolute;
        top: 0.75rem;
        right: 1rem;
        z-index: 1;
        color: #f5f4f5;
        text-decoration: none;
        border: 1px solid #2e2c30;
        background-color: #2e2c30;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      "
      >Entrar / Minha conta</a
    >

    <div class="container">
      <img src="./src/assets/logo.svg" alt="Logo" class="logo" />

      <form class="form">
        <header>
          <h1>Agende um atendimento</h1>
          <p>
            Selecione data, horário e informe o nome do cliente para criar o
            agendamento
          </p>
        </header>

        <label for="date" class="label">Data</label>
        <div class="input">
          <i><img src="./src/assets/calendar.svg" alt="Calendário" /></i>
          <input type="date" id="date" name="date" required />
        </div>

        <span class="label">Horários</span>
        <ul id="hours" class="hours" aria-label="Horários disponíveis de manhã">
          <!-- Exemplo: Manhã
          <li data-period="morning" class="hour-period">Manhã</li>
          <li data-period="morning" value="09:00" class="hour hour-available">
            09:00
          </li>
          <li data-period="morning" value="10:00" class="hour hour-available">
            10:00
          </li>
          <li data-period="morning" value="11:00" class="hour hour-unavailable">
            11:00
          </li>
          <li data-period="morning" value="12:00" class="hour hour-available">
            12:00
          </li> -->
          <!-- Exemplo: Tarde  
          <li data-period="morning" class="hour-period">Tarde</li>
          <li
            data-period="afternoon"
            value="13:00"
            class="hour hour-unavailable"
          >
            13:00
          </li>
          <li
            data-period="afternoon"
            value="14:00"
            class="hour hour-unavailable"
          >
            14:00
          </li>
          <li data-period="afternoon" value="15:00" class="hour hour-available">
            15:00
          </li>
          <li
            data-period="afternoon"
            value="16:00"
            class="hour hour-unavailable"
          >
            16:00
          </li>
          <li
            data-period="afternoon"
            value="17:00"
            class="hour hour-unavailable"
          >
            17:00
          </li>
          <li data-period="afternoon" value="18:00" class="hour hour-available">
            18:00
          </li> -->
          <!-- Exemplo: Noite 
          <li data-period="morning" class="hour-period">Noite</li>

          <li data-period="night" value="19:00" class="hour hour-available">
            19:00
          </li>
          <li data-period="night" value="20:00" class="hour hour-available">
            20:00
          </li>
          <li data-period="night" value="21:00" class="hour hour-unavailable">
            21:00
          </li> -->
        </ul>

        <label for="client" class="label">Nome completo</label>
        <div class="input">
          <i><img src="./src/assets/person.svg" alt="Cliente" /></i>
          <input
            type="text"
            id="client"
            name="client"
            placeholder="Nome completo do cliente"
            autocomplete="name"
            required
          />
        </div>

        <label for="email" class="label">E-mail</label>
        <div class="input">
          <i><img src="./src/assets/mail.svg" alt="E-mail" /></i>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="email@exemplo.com"
            autocomplete="email"
            required
          />
        </div>

        <label for="phone" class="label">Contato</label>
        <div class="input">
          <i><img src="./src/assets/phone.svg" alt="Telefone" /></i>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="(00) 00000-0000"
            autocomplete="tel"
            required
          />
        </div>

        <button type="submit" class="button">Agendar</button>
      </form>

      <aside class="schedule">
        <header>
          <h1>Agendamentos</h1>
          <p>Visualize os agendamentos de acordo com o dia selecionado</p>
        </header>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/morning.svg" alt="Manhã" />
            <strong>Manhã</strong>
            <span>09h-12h</span>
          </header>
          <ul id="period-morning" class="period">
            <!-- Exemplo  
            <li>
              <strong>11:00</strong>
              <span>Rodrigo Gonçalves</span>
              <img
                src="./src/assets/cancel.svg"
                alt="Cancelar"
                class="cancel-icon"
              />
            </li> -->
          </ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/afternoon.svg" alt="Tarde" />
            <strong>Tarde</strong>
            <span>13h-18h</span>
          </header>
          <ul id="period-afternoon" class="period">
            <!-- Exemplo 
            <li>
              <strong>14:00</strong>
              <span>Rodrigo Gonçalves</span>
              <img
                src="./src/assets/cancel.svg"
                alt="Cancelar"
                class="cancel-icon"
              />
            </li> -->
          </ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/night.svg" alt="Noite" />
            <strong>Noite</strong>
            <span>19h-21h</span>
          </header>
          <ul id="period-night" class="period">
            <!-- Exemplo 
            <li>
              <strong>19:00</strong>
              <span>Rodrigo Gonçalves</span>
              <img
                src="./src/assets/cancel.svg"
                alt="Cancelar"
                class="cancel-icon"
              />
            </li> -->
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
