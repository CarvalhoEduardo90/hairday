<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- O CSS da app é injetado em runtime pelo style-loader. Sem isto o
         browser pinta o fundo branco padrão até o bundle executar. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background-color: #19181b;
        color: #f5f4f5;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./src/assets/logo.jpg" />
    <title>Piquet Barbearia — Clientes</title>

    <style>
      .admin {
        max-width: 50rem;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }
      .admin-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
      }
      .admin-top img.logo-img {
        height: 3.5rem;
      }
      .admin-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .admin-logout {
        background: none;
        border: 1px solid #2e2c30;
        color: #f5f4f5;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      .admin-logout:hover {
        background-color: #2e2c30;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        color: #98959d;
        font-size: 0.8rem;
        align-items: center;
      }

      .clients {
        list-style: none;
      }
      .clients li {
        border: 1px solid #2e2c30;
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
        margin-bottom: 0.75rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .client-info {
        flex: 1;
        min-width: 0;
      }
      .client-info strong {
        display: block;
      }
      .client-info span {
        color: #98959d;
        font-size: 0.82rem;
      }
      .client-action button {
        background: none;
        border: 1px solid #2e2c30;
        color: #f5f4f5;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.82rem;
      }
      .client-action button:hover:not(:disabled) {
        background-color: #2e2c30;
      }
      .client-action button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .badge-avulso {
        background: #3e3c41;
        color: #b2afb6;
      }
      .badge-cadastrado {
        background: #243b53;
        color: #9ec5ff;
      }
      .badge-assinante {
        background: #b8952e;
        color: #19181b;
      }
      .empty {
        color: #98959d;
        font-size: 0.9rem;
      }

      .client-action {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      /* Seletor de perfil de acesso (só aparece para o admin). */
      .role-select {
        background: #19181b;
        border: 1px solid #2e2c30;
        color: #f5f4f5;
        border-radius: 0.5rem;
        padding: 0.5rem 0.6rem;
        font-family: inherit;
        font-size: 0.82rem;
        cursor: pointer;
      }
      .role-select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Status (usado no histórico). */
      .status {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .st-upcoming {
        background: #243b53;
        color: #9ec5ff;
      }
      .st-done {
        background: #1f3d2b;
        color: #86e0a6;
      }
      .st-cancelled {
        background: #3e2c2c;
        color: #f0a3a3;
      }

      /* Modal de histórico. */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        z-index: 50;
      }
      .modal-backdrop[hidden] {
        display: none;
      }
      .modal {
        background-color: #232225;
        border: 1px solid #2e2c30;
        border-radius: 0.75rem;
        max-width: 32rem;
        width: 100%;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid #2e2c30;
      }
      .modal-head h2 {
        font-size: 1.1rem;
      }
      .modal-close {
        background: none;
        border: none;
        color: #f5f4f5;
        font-size: 1.2rem;
        cursor: pointer;
        line-height: 1;
      }
      .modal-body {
        padding: 1rem 1.5rem 1.5rem;
        overflow-y: auto;
      }
      .history-list {
        list-style: none;
      }
      .history-list li {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid #2e2c30;
      }
      .history-list li:last-child {
        border-bottom: none;
      }
      .history-list .when {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="admin">
      <div class="admin-top">
        <img src="./src/assets/logo.png" alt="Piquet Barbearia" class="logo-img" />
        <div class="admin-nav">
          <a href="admin.html" class="admin-logout">Agendamentos</a>
          <button id="logout" class="admin-logout">Sair</button>
        </div>
      </div>

      <header style="margin-bottom: 1.5rem">
        <h1>Clientes</h1>
        <p style="color: #98959d; font-size: 0.87rem">
          Gerencie os assinantes da barbearia
        </p>
      </header>

      <div class="legend">
        <span class="badge badge-avulso">Avulso</span> sem conta
        <span class="badge badge-cadastrado">Cadastrado</span> com conta
        <span class="badge badge-assinante">Assinante</span> assinante (1 corte/semana)
      </div>

      <ul class="clients" id="clients"></ul>
    </main>

    <!-- Modal de histórico do cliente -->
    <div class="modal-backdrop" id="history-modal" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="history-title"
      >
        <div class="modal-head">
          <h2 id="history-title">Histórico</h2>
          <button class="modal-close" id="history-close" aria-label="Fechar">
            ✕
          </button>
        </div>
        <div class="modal-body">
          <ul class="history-list" id="history-list"></ul>
        </div>
      </div>
    </div>
  </body>
</html>
