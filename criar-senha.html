<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./src/assets/scissors.svg" />
    <title>Hair Day - Criar senha</title>

    <style>
      .auth {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
      }
      .auth-form-col {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }
      .password-card {
        width: 100%;
        max-width: 22rem;
      }
      .password-card img.logo-img {
        height: 2.5rem;
        margin-bottom: 1.5rem;
      }
      .password-card h1 {
        font-size: 1.25rem;
        margin-bottom: 0.25rem;
      }
      .password-card p.subtitle,
      .status-message {
        color: #98959d;
        font-size: 0.87rem;
        margin-bottom: 1.5rem;
      }
      .password-card form {
        display: flex;
        flex-direction: column;
      }
      .password-card .label {
        display: block;
        margin-bottom: 0.5rem;
      }
      .status-message {
        border: 1px solid #2e2c30;
        border-radius: 0.5rem;
        padding: 0.75rem;
        margin-top: 1rem;
        margin-bottom: 0;
      }
      .status-message.error {
        color: #f0a3a3;
        border-color: #3e2c2c;
        background: #231b1b;
      }
      .status-message.success {
        color: #86e0a6;
        border-color: #1f3d2b;
        background: #17251c;
      }
      .auth-side {
        background-color: #232225;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem;
      }
      .auth-side .side-logo {
        width: 10rem;
        margin-bottom: 2.5rem;
      }
      .auth-side h2 {
        font-size: 1.9rem;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 0.75rem;
      }
      .auth-side .side-sub {
        color: #98959d;
        font-size: 1rem;
        margin-bottom: 2.5rem;
        max-width: 26rem;
      }
      .auth-side ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 26rem;
      }
      .auth-side li {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        color: #f5f4f5;
        font-size: 1rem;
      }
      .auth-side li::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: #b8952e;
        flex: 0 0 auto;
        margin-top: 0.45rem;
      }
      @media (max-width: 1100px) {
        .auth {
          grid-template-columns: 1fr;
        }
        .auth-side {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth">
      <section class="auth-form-col">
        <div class="password-card">
          <img src="./src/assets/logo.svg" alt="Hair Day" class="logo-img" />
          <h1>Criar senha</h1>
          <p class="subtitle">Defina sua senha para acessar sua conta.</p>

          <form id="password-form" hidden>
            <label for="password" class="label">Nova senha</label>
            <div class="input">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua nova senha"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>

            <label for="confirm-password" class="label">Confirmar senha</label>
            <div class="input">
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirme sua nova senha"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>

            <button type="submit" class="button" id="submit-button">
              Salvar senha
            </button>
          </form>

          <p class="status-message" id="status-message">Validando convite...</p>
        </div>
      </section>

      <aside class="auth-side">
        <img src="./src/assets/logo.svg" alt="Hair Day" class="side-logo" />
        <h2>Sua conta Hair Day</h2>
        <p class="side-sub">
          Depois de criar sua senha, use seu e-mail para entrar e acompanhar seus
          agendamentos.
        </p>
        <ul>
          <li>Acesse seus horarios reservados</li>
          <li>Cancele ou remarque quando precisar</li>
          <li>Receba confirmacoes por e-mail</li>
        </ul>
      </aside>
    </div>
  </body>
</html>
